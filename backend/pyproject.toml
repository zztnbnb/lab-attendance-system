[project]
name = "lab-attendance-backend"
version = "0.1.0"
description = "实验室人脸识别打卡系统 FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=44,<46",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "orjson>=3.10,<4",
  "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/jobs/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
